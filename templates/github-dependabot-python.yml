# .github/dependabot.yml — Configuración Dependabot para proyectos Python/Data Science
# Copiar a .github/dependabot.yml en el repo.

version: 2
updates:
  # Dependencias Python (pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Agrupar updates de patches y minor en un solo PR (menos ruido)
    groups:
      production-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # Ignorar major bumps (requieren revisión manual)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
