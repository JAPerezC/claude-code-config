# .github/workflows/ci.yml — CI básico para proyectos Python
# Copiar a .github/workflows/ci.yml en el repo.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint + tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff pytest

      - name: Lint con Ruff
        run: ruff check . --output-format=github

      - name: Formato con Ruff
        run: ruff format --check .

      - name: Tests con pytest
        run: |
          if [ -d tests ] || [ -d test ]; then
            pytest --tb=short
          else
            echo "Sin tests aún — skipped"
          fi
